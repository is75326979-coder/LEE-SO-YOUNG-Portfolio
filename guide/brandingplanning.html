<!doctype html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>brandingplanning</title>

	<!-- Link Swiper's CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
    />

	<link href="css/style.css" rel="stylesheet" type="text/css">

	<link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">


</head>

<body>
	<div class="swiper mySwiper">
		<div class="swiper-wrapper">
			<div class="swiper-slide"><img src="./images/brandplanning1.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning2.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning3.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning4.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning5.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning6.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning7.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning8.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning9.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning10.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning12.png" alt="guide"></div>
			<div class="swiper-slide"><img src="./images/brandplanning13.png" alt="guide"></div>
		</div>
		<div class="swiper-pagination"></div>
	</div>



	<!-- <script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.4.3/jquery.min.js"></script> -->

	
<!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
	<script src="js/jquery-1.12.3.js"></script>
	<script src="js/sub_script.js"></script>

	<script>
		var swiper = new Swiper('.mySwiper', {
			direction: 'vertical',
			slidesPerView: 1,
			spaceBetween: 30,
			mousewheel: true,
			pagination: {
				el: '.swiper-pagination',
				clickable: true,
			},
		});
	</script>
</body>

</html>
